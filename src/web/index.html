<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>szklana.pogoda</title>
  <link rel="stylesheet" href="/98.css" />
  <style>
    body {
      background: #008080;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 4rem;
    }
    .window {
      width: 320px;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">szklana.pogoda</div>
    </div>
    <div class="window-body">
      <p>Hello world portalu. Backend odpowiada na ping:</p>
      <button id="ping-button">Ping</button>
    </div>
    <div class="status-bar">
      <p class="status-bar-field" id="pong">gotowy</p>
    </div>
  </div>

  <script>
    const button = document.getElementById("ping-button");
    const pong = document.getElementById("pong");

    button.addEventListener("click", async () => {
      pong.textContent = "...";
      try {
        const response = await fetch("/api/ping", { method: "POST" });
        if (!response.ok) {
          pong.textContent = `blad: HTTP ${response.status}`;
          return;
        }
        pong.textContent = await response.text();
      } catch (err) {
        console.error("ping failed", err);
        pong.textContent = "blad polaczenia";
      }
    });
  </script>
</body>
</html>
