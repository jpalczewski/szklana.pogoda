name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  ZIGLINT_VERSION: v0.5.3
  ZIGLINT_SHA256: 7560bf5ad36170ae1560505a5e273c83376534feccad23a9f7be716f94853539

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      # On a cache miss, `ZIG_GLOBAL_CACHE_DIR` (set by setup-zig above)
      # starts empty; the first fetch of zig-sqlite's own dependency (the
      # sqlite.org amalgamation zip) then fails with "failed to create
      # temporary zip file: FileNotFound", because Zig 0.16 doesn't create
      # the cache's tmp/ subdirectory before writing into it on that path.
      # See AGENTS.md.
      - name: Work around Zig zip-fetch cache bug
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR}/tmp"

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src tools

      - name: Lint (zlinter)
        run: zig build lint -- --max-warnings 0

      - name: Install ziglint
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/rockorager/ziglint/releases/download/${ZIGLINT_VERSION}/ziglint-x86_64-linux.tar.gz" \
            --output "${RUNNER_TEMP}/ziglint.tar.gz"
          echo "${ZIGLINT_SHA256}  ${RUNNER_TEMP}/ziglint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/ziglint.tar.gz" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/ziglint" /usr/local/bin/ziglint

      - name: Lint (ziglint)
        run: ./scripts/ziglint.sh src tools build.zig

      - name: Run tests
        run: zig build test

      - name: Build
        run: zig build

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      # The image is built exactly once, into the local Docker daemon, and that
      # same image is smoke-tested and then pushed: nothing is rebuilt between
      # the test and the push, so what reaches GHCR is what was tested.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # /healthz needs no database or network access (see the Dockerfile's
      # HEALTHCHECK), so this proves the binary starts and serves in the
      # final Alpine image without depending on upstream services.
      - name: Smoke-test image
        run: |
          image="$(head -n1 <<< "${TAGS}")"
          docker run --detach --name smoke "${image}"
          for _ in $(seq 1 30); do
            if docker exec smoke wget -q -O /dev/null http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      # Only on main; `needs: test` keeps a broken build or lint failure from
      # ever reaching GHCR, and a failed smoke test stops it here.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: env.PUSH == 'true'
        run: |
          while read -r tag; do
            docker push "${tag}"
          done <<< "${TAGS}"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
